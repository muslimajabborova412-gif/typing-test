<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <title>TypingTest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="controls-bar">
    <select id="lang-select">
        <option value="ru">Русский (russian)</option>
        <option value="tg">Тоҷикӣ (tajik)</option>
        <option value="en">English (english)</option>
    </select>
    <div>Normal | Advanced | <span id="time">60</span>с | 🔄 | ⚙️</div>
</div>

<div class="container">
    <div id="user-greeting"></div>
    <div class="word-display" id="word-display"></div>
    <input type="text" id="word-input" placeholder="Барои оғоз нависед..." disabled autocomplete="off">
    <button id="start-btn">Оғози бозӣ</button>
</div>

<script src="script.js"></script>
</body>
</html>
